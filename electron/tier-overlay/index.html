<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <title>Excalibur Tier Badge</title>
  <style>
    /* Whole window is a click-through transparent canvas. The pill
       animates into the top-left and removes itself when its CSS
       animation completes - no JS animation loop needed. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    .pill {
      position: fixed;
      top: 12px;
      left: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateX(-10px) scale(0.94);
      will-change: opacity, transform;
      visibility: hidden;
    }
    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 6px 0 currentColor;
      flex: 0 0 auto;
    }
    .pill.show {
      visibility: visible;
      animation: pop 2200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pop {
      0%   { opacity: 0; transform: translateX(-10px) scale(0.94); }
      14%  { opacity: 1; transform: translateX(0)     scale(1);    }
      78%  { opacity: 1; transform: translateX(0)     scale(1);    }
      100% { opacity: 0; transform: translateX(-4px)  scale(0.97); }
    }

    /* Per-tier color palettes. dot = the glowing circle, .pill = background.
       Foreground (text) color is set on the pill directly. */
    .pill[data-tier="free"] {
      background: rgba(24, 24, 28, 0.78);
      color: #d8dadf;
      box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.45),
                  inset 0 1px 0 rgba(255, 255, 255, 0.06),
                  0 0 0 1px rgba(255, 255, 255, 0.07);
    }
    .pill[data-tier="free"] .dot { color: #b6bac1; background: #b6bac1; }

    .pill[data-tier="pro"] {
      background: rgba(48, 28, 6, 0.82);
      color: #ffd789;
      box-shadow: 0 10px 26px -6px rgba(180, 100, 20, 0.55),
                  inset 0 1px 0 rgba(255, 220, 150, 0.14),
                  0 0 0 1px rgba(252, 211, 77, 0.30);
    }
    .pill[data-tier="pro"] .dot { color: #facc15; background: #facc15; }

    .pill[data-tier="pro_plus"] {
      background: linear-gradient(135deg, rgba(64, 40, 8, 0.88), rgba(96, 56, 8, 0.85));
      color: #fff1c0;
      box-shadow: 0 12px 30px -6px rgba(252, 211, 77, 0.65),
                  inset 0 1px 0 rgba(255, 240, 200, 0.18),
                  0 0 0 1px rgba(252, 211, 77, 0.40);
    }
    .pill[data-tier="pro_plus"] .dot { color: #fde047; background: #fde047; }

    .pill[data-tier="dev"] {
      background: rgba(6, 36, 48, 0.84);
      color: #a5f3fc;
      box-shadow: 0 10px 28px -6px rgba(34, 211, 238, 0.55),
                  inset 0 1px 0 rgba(165, 243, 252, 0.12),
                  0 0 0 1px rgba(34, 211, 238, 0.35);
    }
    .pill[data-tier="dev"] .dot { color: #22d3ee; background: #22d3ee; }
  </style>
</head>
<body>
  <div id="pill" class="pill" data-tier="free">
    <span class="dot" aria-hidden="true"></span>
    <span id="label">FREE</span>
  </div>

  <!-- DEBUG marker: solid red rectangle in the top-left corner. Hidden
       by default; the "Debug" button in Settings → Developer Panel
       triggers the overlay with tier='__debug__' which flips this to
       display:flex for 4 seconds. Used to isolate "window not rendered"
       from "pill animation broken" failures. -->
  <div id="debug" style="display:none;position:fixed;top:0;left:0;width:200px;height:80px;background:#ff0044;color:#fff;font:bold 14px monospace;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 2px #000;">
    OVERLAY DEBUG
  </div>

  <!-- External script file - inline <script> blocks are blocked by the
       page CSP (`default-src 'self'`). Keeping the script external is
       both CSP-clean AND the standard pattern; weakening CSP with
       'unsafe-inline' would be worse. -->
  <script src="./overlay.js"></script>
</body>
</html>
